spring.application.name=newsportal
server.port=${PORT:8080}

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/newsDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) - Optimized for Render Free Tier (512MB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Settings
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# File Upload Settings (Bổ sung Tomcat Swallow & Post Size cho Oracle Cloud VPS)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=25MB
server.tomcat.max-http-form-post-size=25MB

# Gmail SMTP Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OAuth2 Social Login (Google & Facebook Authorization Code Flow)
oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/users/auth/social/callback}
oauth2.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
oauth2.google.token-uri=https://oauth2.googleapis.com/token
oauth2.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
oauth2.google.scope=openid email profile

# Task3 compatibility aliases
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/users/auth/social/callback}

oauth2.facebook.client-id=${FACEBOOK_CLIENT_ID:}
oauth2.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
oauth2.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:http://localhost:8080/api/v1/users/auth/social/callback}
oauth2.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth
oauth2.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token
oauth2.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture.width(200).height(200)
oauth2.facebook.scope=email,public_profile

# Cloudinary Image Cloud Storage (25GB Free Storage)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:mkszwwfc}
cloudinary.api-key=${CLOUDINARY_API_KEY:256446674739447}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
